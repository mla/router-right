name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: perl:${{ matrix.perl }}
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.20', '5.26', '5.30', '5.34', '5.38', '5.40', '5.42']
    steps:
      - uses: actions/checkout@v4
      - run: perl -V
      - run: cpanm --quiet --notest --installdeps --with-test .
      - run: prove -lr t

  coverage:
    runs-on: ubuntu-latest
    container: perl:5.42
    steps:
      - uses: actions/checkout@v4
      - run: cpanm --quiet --notest --installdeps --with-test --with-develop .
      - run: HARNESS_PERL_SWITCHES=-MDevel::Cover=+ignore,^t/ prove -lr t
      - run: cover -report text -select_re '^lib/' | tee coverage.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt
